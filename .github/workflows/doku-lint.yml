name: Doku-Lint (zentral, wiederverwendbar)

# Wiederverwendbarer Workflow fuer Klangschalen-Repositories.
# Bei Pull Requests wird immer der exakte Quell-Commit geprueft, niemals der
# von GitHub erzeugte synthetische Merge-Commit.
#
# Auf Push bleibt Gate 3 fuer echte direkte Commits hart. GitHub-erzeugte
# Merge-/PR-Commits werden nicht erneut am synthetischen Titel abgelehnt,
# weil der eingereichte PR-Head bereits im pull_request-Lauf geprueft wurde.
#
# Beispiel:
#
#   permissions:
#     contents: read
#   jobs:
#     lint:
#       uses: Klangschalen/.github/.github/workflows/doku-lint.yml@<SHA>
#       with:
#         pflicht_dateien: "README.md,LICENSE,CHANGELOG.md,..."
#         warn_only: true
#         commit_format_warn_only: false
#       permissions:
#         contents: read
#       secrets: inherit

on:
  workflow_call:
    inputs:
      pflicht_dateien:
        description: "Komma-getrennte Liste der Pflicht-Dateien"
        type: string
        default: "README.md,LICENSE,CHANGELOG.md,STATUS.md,CONTRIBUTING.md,SECURITY.md,.editorconfig,.gitignore"
      warn_only:
        description: "Gate 1+2: wenn true, nur Warnung statt Fehler"
        type: boolean
        default: true
      commit_format_warn_only:
        description: "Gate 3: wenn true, nur Warnung statt Fehler"
        type: boolean
        default: false
      allowed_commit_types:
        description: "Komma-getrennte erlaubte Conventional-Commit-Typen"
        type: string
        default: "feat,fix,docs,style,refactor,test,chore,perf,build,ci,revert,policy"

permissions:
  contents: read

jobs:
  pruefen:
    name: Doku-Lint Pruefung
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
      ALLOWED_COMMIT_TYPES: ${{ inputs.allowed_commit_types }}
      CONVENTIONAL_SUBJECT_PATTERN: '^([a-z][a-z0-9-]*)(\([a-z0-9-]+\))?!?:'
      CHANGELOG_PATH_PATTERN: '^(CHANGELOG\.md|CHANGELOG\.d/.+\.md)$'
    steps:
      - name: Exakten Quell-Commit laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Geprueften Commit ausgeben
        shell: bash
        run: |
          set -euo pipefail
          echo "Ereignis: ${{ github.event_name }}"
          echo "Quell-Commit: $SOURCE_COMMIT"
          if [ -n "$BASE_COMMIT" ]; then
            echo "Basis-Commit: $BASE_COMMIT"
          fi

      - name: Gate 1 - Pflicht-Dateien vorhanden
        shell: bash
        env:
          WARN_ONLY: ${{ inputs.warn_only }}
        run: |
          set -euo pipefail
          IFS=',' read -ra files <<< "${{ inputs.pflicht_dateien }}"
          missing=()
          present=()
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              present+=("$file")
            else
              missing+=("$file")
            fi
          done

          echo "Vorhanden (${#present[@]}): ${present[*]}"
          echo "Fehlen   (${#missing[@]}): ${missing[*]:-keine}"

          if [ "${#missing[@]}" -gt 0 ]; then
            message="Fehlende Pflicht-Dateien: ${missing[*]}"
            if [ "$WARN_ONLY" = "true" ]; then
              echo "::warning::$message"
            else
              echo "::error::$message"
              exit 1
            fi
          fi

      - name: Gate 2 - Changelog-Beleg bei Code-Aenderung
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          WARN_ONLY: ${{ inputs.warn_only }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
          fi
          git cat-file -e "$BASE_COMMIT^{commit}"

          changed="$(git diff --name-only "$BASE_COMMIT"..."$SOURCE_COMMIT")"
          echo "Geaenderte Dateien:"
          printf '%s\n' "$changed"

          code_changed="$(printf '%s\n' "$changed" | grep -E '\.(php|py|js|ts|sh|yml|yaml)$' || true)"
          changelog_changed="$(printf '%s\n' "$changed" | grep -E "$CHANGELOG_PATH_PATTERN" || true)"

          if [ -n "$code_changed" ] && [ -z "$changelog_changed" ]; then
            message="Code-Aenderung ohne CHANGELOG.md oder CHANGELOG.d/*.md: $code_changed"
            if [ "$WARN_ONLY" = "true" ]; then
              echo "::warning::$message"
            else
              echo "::error::$message"
              exit 1
            fi
          elif [ -n "$code_changed" ]; then
            echo "OK - Changelog-Beleg vorhanden:"
            printf '%s\n' "$changelog_changed"
          else
            echo "Keine Code-Aenderung im Pull Request."
          fi

      - name: Gate 3 - Conventional Head-Commit
        shell: bash
        env:
          COMMIT_FORMAT_WARN_ONLY: ${{ inputs.commit_format_warn_only }}
        run: |
          set -euo pipefail

          message="$(git log -1 --pretty=%s "$SOURCE_COMMIT")"
          echo "Gepruefter Commit-Titel: $message"
          echo "Erlaubte Typen: $ALLOWED_COMMIT_TYPES"

          if [ "${{ github.event_name }}" = "push" ]; then
            parent_line="$(git rev-list --parents -n1 "$SOURCE_COMMIT")"
            parent_count=$(( $(awk '{print NF}' <<< "$parent_line") - 1 ))
            committer_email="$(git log -1 --pretty=%ce "$SOURCE_COMMIT")"

            if [ "$parent_count" -gt 1 ]; then
              echo "OK - Git-Merge-Commit auf Push: PR-Head wurde im pull_request-Gate geprueft; synthetischer Merge-Titel wird nicht erneut blockierend bewertet."
              exit 0
            fi

            if [[ "$committer_email" == *"noreply@github.com" ]] && [[ "$message" =~ \(#[0-9]+\)$ ]]; then
              echo "OK - GitHub-erzeugter PR-Commit auf Push: PR-Head wurde bereits blockierend geprueft."
              exit 0
            fi
          fi

          format_ok=false
          commit_type=""
          if [[ "$message" =~ $CONVENTIONAL_SUBJECT_PATTERN ]]; then
            format_ok=true
            commit_type="${BASH_REMATCH[1]}"
          fi

          type_ok=false
          if [ "$format_ok" = "true" ]; then
            IFS=',' read -ra allowed_types <<< "$ALLOWED_COMMIT_TYPES"
            for allowed_type in "${allowed_types[@]}"; do
              allowed_type="${allowed_type//[[:space:]]/}"
              if [ "$commit_type" = "$allowed_type" ]; then
                type_ok=true
                break
              fi
            done
          fi

          if [ "$format_ok" = "true" ] && [ "$type_ok" = "true" ]; then
            echo "OK - Conventional Head-Commit mit Typ '$commit_type'"
            exit 0
          fi

          if [ "$format_ok" != "true" ]; then
            problem="Head-Commit $SOURCE_COMMIT hat kein Conventional-Commit-Format: '$message'"
          else
            problem="Commit-Typ '$commit_type' ist nicht erlaubt: '$message'"
          fi

          hint="Erlaubt: $ALLOWED_COMMIT_TYPES. Richtlinien nutzen 'policy: ...' oder 'docs(policy): ...'."
          if [ "$COMMIT_FORMAT_WARN_ONLY" = "true" ]; then
            echo "::warning::$problem. $hint"
          else
            echo "::error::$problem. $hint"
            exit 1
          fi
