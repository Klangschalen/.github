name: Doku-Lint (zentral, wiederverwendbar)

# Reusable Workflow - wird von anderen Repos per `uses:` eingebunden.
# Beispiel-Aufruf im Caller-Repo:
#
#   permissions:
#     contents: read
#   jobs:
#     lint:
#       uses: Klangschalen/.github/.github/workflows/doku-lint.yml@<SHA>
#       with:
#         pflicht_dateien: "README.md,LICENSE,CHANGELOG.md,..."
#       permissions:
#         contents: read
#       secrets: inherit
#
# WICHTIG: Caller MUSS `secrets: inherit` setzen, sonst kommt der GITHUB_TOKEN
# nicht beim cross-org Reusable-Workflow an (actions/checkout schlaegt sonst
# mit "could not read Username" fehl).

on:
  workflow_call:
    inputs:
      pflicht_dateien:
        description: "Komma-getrennte Liste der Pflicht-Dateien"
        type: string
        default: "README.md,LICENSE,CHANGELOG.md,STATUS.md,CONTRIBUTING.md,SECURITY.md,.editorconfig,.gitignore"
      warn_only:
        description: "Wenn true, nur Warnung statt Fehler"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  pruefen:
    name: Doku-Lint Pruefung
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # SHA-Pin auf v6.0.2 (Node 24 ready, vermeidet Deprecation-Warning 2026-06-02)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Gate 1 - Pflicht-Dateien vorhanden
        shell: bash
        run: |
          set -e
          IFS=',' read -ra files <<< "${{ inputs.pflicht_dateien }}"
          missing=()
          present=()
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              present+=("$f")
            else
              missing+=("$f")
            fi
          done
          echo "Vorhanden (${#present[@]}): ${present[*]}"
          echo "Fehlen   (${#missing[@]}): ${missing[*]:-keine}"
          if [ ${#missing[@]} -gt 0 ]; then
            if [ "${{ inputs.warn_only }}" = "true" ]; then
              echo "::warning::Fehlende Pflicht-Dateien: ${missing[*]}"
            else
              echo "::error::Fehlende Pflicht-Dateien: ${missing[*]}"
              exit 1
            fi
          fi

      - name: Gate 2 - CHANGELOG-Touch bei Code-Aenderung (nur Pull Requests)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git fetch origin "$base" --depth=50 || true
          changed=$(git diff --name-only "$base"..."$head" || git diff --name-only HEAD~1)
          echo "Geaenderte Dateien:"
          echo "$changed"
          code_changed=$(echo "$changed" | grep -E '\.(php|py|js|ts|sh|yml|yaml)$' || true)
          if [ -n "$code_changed" ]; then
            if echo "$changed" | grep -qE '^CHANGELOG\.md$'; then
              echo "OK - CHANGELOG.md ist mit beruehrt"
            else
              msg="Code-Aenderung ohne CHANGELOG-Touch: $code_changed"
              if [ "${{ inputs.warn_only }}" = "true" ]; then
                echo "::warning::$msg"
              else
                echo "::error::$msg"
                exit 1
              fi
            fi
          else
            echo "Keine Code-Aenderung im PR, CHANGELOG-Touch nicht noetig."
          fi

      - name: Gate 3 - Commit-Nachrichten-Norm
        # SSoT: Klangschalen/claude-config rules/commit-nachrichten-norm.md
        # (tools/commit_nachricht_pruefen.py liest denselben Ausdruck von dort;
        # hier ein Spiegel, siehe Kommentar oben in dieser Datei zu Cross-Repo-
        # Checkouts ohne Read-Token).
        #
        # Bug behoben 2026-09-02 (plans/commit-nachrichten-sauber-nightly.md):
        # Diese Gate prueft ab jetzt bei Pull Requests den PR-TITEL, nicht mehr
        # `git log -1`. Grund: Repos mit Squash-Merge +
        # squash_merge_commit_title=PR_TITLE (Tor 1 der Norm) verwenden den
        # PR-Titel als endgueltige Commit-Nachricht auf dem Standardzweig - der
        # letzte Rohcommit des Feature-Branchs (oft ein Zwischenstand wie "wip"
        # oder "fix typo") landet dort nie. Ausserhalb von Pull Requests (z.B.
        # direkter Push) bleibt `git log -1` die einzig verfuegbare Quelle.
        shell: bash
        env:
          # Ueber env statt direkt in ${{ }} im run-Block interpoliert - ein
          # PR-Titel ist Fremdeingabe und darf nicht als Skript-Text landen
          # (Skript-Injektionsmuster, siehe claude-config PR #351/#347).
          PR_TITEL: ${{ github.event.pull_request.title }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            quelle="PR-Titel"
            msg="$PR_TITEL"
          else
            quelle="letzter Commit-Titel"
            msg=$(git log -1 --pretty=%s)
          fi
          echo "$quelle: $msg"
          if echo "$msg" | grep -qP '^(feat|fix|refactor|test|docs|chore|ci|build|perf|style|revert)(\([a-z0-9._/-]+\))?!?: \S'; then
            echo "OK - erfuellt die Commit-Nachrichten-Norm"
          else
            warn="$quelle erfuellt nicht die Commit-Nachrichten-Norm: '$msg' (erwartet z.B. 'feat(scope): Text' - siehe rules/commit-nachrichten-norm.md in claude-config)"
            if [ "${{ inputs.warn_only }}" = "true" ]; then
              echo "::warning::$warn"
            else
              echo "::error::$warn"
              exit 1
            fi
          fi