# Klangschalen Reusable Workflow: gitleaks-scan
#
# Sucht im Repo nach versehentlich eingecheckten Secrets (API-Keys, Passwoerter,
# Tokens). Aufrufbar via `workflow_call` aus allen Klangschalen-Repos.
#
# SOTA-Quelle: https://github.com/Klangschalen/claude-config/blob/master/docs/sota/gitleaks-installation-2026-05-24.md
# Empfehlung: Weg C (GitHub-Action, ICE 6.48 MUST) plus Weg A (Chocolatey,
# ICE 4.32 SHOULD) parallel.
#
# Fix 2026-09-04: Ein Pull Request darf nicht durch Commits eines anderen
# offenen Zweigs rot werden. `fetch-depth: 0` bleibt fuer den Vergleich mit dem
# Basis-Commit noetig. Der Scan bekommt aber einen expliziten Git-Bereich:
# - Pull Request: Basis-SHA..Quell-SHA
# - Push: vorheriger SHA..aktueller SHA
# - Zeitplan/manuell: HEAD und damit nur die Historie des ausgecheckten Zweigs
# `--all` ist bewusst verboten, weil es fremde Zweige wieder einschliessen wuerde.

name: gitleaks-scan (reusable)

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: gitleaks-CLI-Version Pin (default 8.21.2 - getestet 2026-05-26)
        type: string
        required: false
        default: "8.21.2"
      fail-on-detection:
        description: Job rot machen wenn Secrets gefunden werden (default true)
        type: boolean
        required: false
        default: true
      config-path:
        description: Pfad zu .gitleaks.toml im Caller-Repo (leer = .gitleaks.toml im Repo-Root)
        type: string
        required: false
        default: ""
    secrets:
      GITLEAKS_LICENSE:
        description: "Deprecated: nicht mehr benoetigt seit CLI-Aufruf"
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    name: gitleaks-scan
    steps:
      - name: Checkout des exakten ausloesenden Commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks CLI
        id: install
        run: |
          set -euo pipefail
          V="${{ inputs.gitleaks-version }}"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "Downloading $URL"
          # --retry-all-errors: auch Connection-Resets (curl exit 35) erneut versuchen,
          # sonst macht ein transienter Netzfehler den Scheduled-Run rot
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$URL" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan-Bereich bestimmen
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${PR_BASE_SHA}^{commit}"
            git cat-file -e "${PR_HEAD_SHA}^{commit}"
            LOG_OPTS="${PR_BASE_SHA}..${PR_HEAD_SHA}"
            SCOPE_KIND="pull_request_change"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "$ZERO_SHA" ]]; then
            [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${PUSH_BEFORE_SHA}^{commit}"
            git cat-file -e "${CURRENT_SHA}^{commit}"
            LOG_OPTS="${PUSH_BEFORE_SHA}..${CURRENT_SHA}"
            SCOPE_KIND="push_change"
          else
            git cat-file -e "HEAD^{commit}"
            LOG_OPTS="HEAD"
            SCOPE_KIND="current_branch_history"
          fi
          echo "log_opts=$LOG_OPTS" >> "$GITHUB_OUTPUT"
          echo "scope_kind=$SCOPE_KIND" >> "$GITHUB_OUTPUT"
          echo "Gitleaks scope: $SCOPE_KIND ($LOG_OPTS)"

      - name: Run gitleaks im bestimmten Bereich
        id: gitleaks
        shell: bash
        env:
          LOG_OPTS: ${{ steps.scope.outputs.log_opts }}
        run: |
          set -uo pipefail
          ARGS=(git --redact -v --no-banner)
          ARGS+=(--log-opts="$LOG_OPTS")
          ARGS+=(--report-format sarif --report-path results.sarif)
          # exit-code 0 = nie hier failen; der folgende Schritt entscheidet sichtbar.
          ARGS+=(--exit-code 0)

          CONFIG_PATH="${{ inputs.config-path }}"
          # Auto-detect: wenn .gitleaks.toml im Repo-Root existiert, nutzen
          if [[ -z "$CONFIG_PATH" && -f ".gitleaks.toml" ]]; then
            CONFIG_PATH=".gitleaks.toml"
          fi
          if [[ -n "$CONFIG_PATH" && -f "$CONFIG_PATH" ]]; then
            ARGS+=(--config "$CONFIG_PATH")
            echo "Using config: $CONFIG_PATH"
          else
            echo "Using gitleaks default rules"
          fi

          gitleaks "${ARGS[@]}" .

          if [[ -f results.sarif ]]; then
            LEAKS=$(jq '[.runs[].results[]] | length' results.sarif)
          else
            LEAKS=0
          fi
          echo "leaks=$LEAKS" >> "$GITHUB_OUTPUT"
          echo "Found leaks: $LEAKS"

      - name: Job-Summary schreiben
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          LEAKS="${{ steps.gitleaks.outputs.leaks || '0' }}"
          {
            echo "# Gitleaks-Scan: $LEAKS Findings"
            echo ""
            echo "- Repo: \`${{ github.repository }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Scan-Art: \`${{ steps.scope.outputs.scope_kind || 'unknown' }}\`"
            echo "- Git-Bereich: \`${{ steps.scope.outputs.log_opts || 'unknown' }}\`"
            echo "- fail-on-detection: \`${{ inputs.fail-on-detection }}\`"
            echo ""
            if [[ -f results.sarif && "$LEAKS" -gt 0 ]]; then
              echo "## Top 20 Findings"
              echo ""
              echo "| Rule | File | Line |"
              echo "|------|------|------|"
              jq -r '[.runs[].results[]] | .[0:20] | .[] |
                "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) |"' \
                results.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact upload (SARIF)
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          retention-days: 30

      - name: Fail wenn Findings und fail-on-detection true
        if: |
          inputs.fail-on-detection == true &&
          steps.gitleaks.outputs.leaks != '0' &&
          steps.gitleaks.outputs.leaks != ''
        shell: bash
        run: |
          echo "::error::Gitleaks fand ${{ steps.gitleaks.outputs.leaks }} Secrets im aktuellen Scan-Bereich - Job wird auf rot gesetzt"
          exit 1

      - name: Hinweis wenn Findings und fail-on-detection false
        if: |
          inputs.fail-on-detection == false &&
          steps.gitleaks.outputs.leaks != '0' &&
          steps.gitleaks.outputs.leaks != ''
        shell: bash
        run: |
          echo "::warning::Gitleaks fand ${{ steps.gitleaks.outputs.leaks }} Secrets im aktuellen Scan-Bereich - Job bleibt gruen. SARIF im Artefakt."
