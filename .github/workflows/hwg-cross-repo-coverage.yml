name: HWG Kernspiegel-Konsumentenabdeckung

# Autoritativer Nachweis fuer den letzten Teil der Kette:
# Git-Kernspiegel (quality-system) -> alle bekannten GitHub-Verbraucher.
# Die vorgelagerte Kette Supabase -> Kernspiegel sowie die Vollabdeckung aller
# riskanten Begriffe prueft quality-system/text-daten-drift.yml. Fehlender
# Cross-Repo-Zugriff auf einen dieser vier Verbraucher ist hier ein Fehler und
# darf niemals als PASS erscheinen. settext-studio ist nur lokal vorhanden und
# bleibt deshalb Teil des autoritativen Nachtlaufs.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * *"
  push:
    paths:
      - ".github/workflows/hwg-cross-repo-coverage.yml"

permissions:
  contents: read

jobs:
  hwg-deckung:
    name: Kernspiegel gegen alle Verbraucher pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kanonische Quelle auschecken (quality-system)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Klangschalen/quality-system
          path: quality-system
          token: ${{ secrets.ORG_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Produktiven Verbraucher auschecken (pl-sets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Klangschalen/pl-sets
          path: pl-sets
          token: ${{ secrets.ORG_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Produktiven Verbraucher auschecken (adk-agents)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Klangschalen/adk-agents
          path: adk-agents
          token: ${{ secrets.ORG_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Produktiven Verbraucher auschecken (unified-agent-system)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Klangschalen/unified-agent-system
          path: unified-agent-system
          token: ${{ secrets.ORG_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Produktiven Verbraucher auschecken (claude-config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Klangschalen/claude-config
          path: .claude
          token: ${{ secrets.ORG_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      # Seit 17.09.2026: Auch die vier uebrigen Konsumenten auschecken.
      # Vorher las dieser Ablauf genau EINEN von fuenf und schrieb das sogar hin
      # ("Deckung: HWG-Kernspiegel 1/5 Konsumenten gelesen", vier Mal "Konsument nicht im
      # Checkout"). Er war damit zu 80 Prozent blind: Als der HWG-Spiegel am 31.08.2026 in
      # VIER Repos gleichzeitig veraltete, sah er nur pl-sets. Die drei anderen fielen erst
      # siebzehn Tage spaeter ueber einen ganz anderen Weg auf.
      #
      # continue-on-error ist Absicht: Ein Konsument, der sich nicht auschecken laesst (fehlendes
      # Token, umbenanntes oder geloeschtes Repo), darf den ganzen Lauf nicht killen. Er
      # erscheint dann wie bisher als "nicht im Checkout (nicht pruefbar)" im Deckungsbericht -
      # weniger Abdeckung, aber nie falsches Gruen.
      - name: Verbraucher auschecken (adk-agents)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Klangschalen/adk-agents
          path: adk-agents
          token: ${{ secrets.ORG_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verbraucher auschecken (unified-agent-system)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Klangschalen/unified-agent-system
          path: unified-agent-system
          token: ${{ secrets.ORG_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verbraucher auschecken (claude-config)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Klangschalen/claude-config
          path: claude-config
          token: ${{ secrets.ORG_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}

      # Seit 28.09.2026: agenten-systeme statt settext-studio. Der Deckungs-Checker
      # (quality-system/tests/check-textdaten-drift.py, HWG_KONSUMENTEN) fuehrt sechs
      # Verbraucher: fuenf GitHub-Repositories und EIN lokales Arbeitsverzeichnis
      # (settext-studio, ein Ordner neben agenten-systeme auf Franks Rechner, kein Repo).
      # Bis heute fehlte hier der fuenfte GitHub-Verbraucher agenten-systeme, dafuer stand
      # ein Checkout fuer "Klangschalen/settext-studio", das GitHub mit "Not Found"
      # beantwortet (Lauf 36461139499). Ergebnis jeden Tag: "HWG-Kernspiegel 4/6",
      # Rueckgabewert 2, rot - auch mit gesetztem ORG_AUDIT_TOKEN. Mit agenten-systeme
      # sind 5/6 lesbar; das fehlende sechste ist als lokal markiert, und genau dann
      # meldet der Checker "PASS (GitHub-Umfang)".
      - name: Verbraucher auschecken (agenten-systeme)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Klangschalen/agenten-systeme
          # Der Checker loest den Ordner im Test-Modus als <Wurzel>/"Agenten Systeme"
          # auf (Name des ersten Kandidaten "D:/Agenten Systeme"); der erste
          # Beweislauf mit path "agenten-systeme" blieb deshalb bei 4/6
          # (Lauf 36462507604). Der Pfad muss so heissen, wie der Checker sucht.
          path: Agenten Systeme
          token: ${{ secrets.ORG_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Deckungslogik gegen falsches Gruen testen
        run: |
          python3 -m pip install --disable-pip-version-check pytest==9.1.1
          python3 -m pytest quality-system/tests/test_check_textdaten_drift.py -q

      - name: Gemergte Kernspiegel und Verbraucher autoritativ pruefen
        # Der Checker darf hier nicht in seinen absichtlich toleranten
        # GitHub-Einzelrepo-Modus fallen. Fehlt ein Checkout, muss rc=2 blockieren.
        env:
          DRIFT_TEST_KONSUMENTEN_WURZEL: ${{ github.workspace }}
          # Fuenf Verbraucher sind GitHub-Repositories. settext-studio ist ein
          # lokales Arbeitsverzeichnis und bleibt im Nachtlauf verpflichtend.
          DRIFT_COVERAGE_SCOPE: github
          GITHUB_ACTIONS: ""
        run: python3 quality-system/tests/check-textdaten-drift.py
