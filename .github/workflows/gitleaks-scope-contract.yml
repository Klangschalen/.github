name: Gitleaks Scope Contract

on:
  pull_request:
    paths:
      - ".github/workflows/gitleaks-scan.yml"
      - ".github/workflows/gitleaks-scope-contract.yml"
      - "tests/test_gitleaks_workflow_scope.py"
      - "CHANGELOG.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gitleaks-scan.yml"
      - ".github/workflows/gitleaks-scope-contract.yml"
      - "tests/test_gitleaks_workflow_scope.py"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  contract:
    name: current-change-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exakten Quell-Commit auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Vertrag in beide Richtungen testen
        run: python3 -m unittest tests.test_gitleaks_workflow_scope -v
